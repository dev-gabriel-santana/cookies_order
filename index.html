<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos de Cookies</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header class="app-header">
    <h1>Pedidos de Cookies</h1>
    <p>Controle de estoque e entregas</p>
  </header>

  <section>
    <h2>Estoque disponível</h2>
    <div class="stock">
      <div class="stock-card">Nutella<strong id="stock-nutella">0</strong></div>
      <div class="stock-card">Tradicional<strong id="stock-tradicional">0</strong></div>
    </div>
    <form id="stock-form" class="row">
      <label>Nutella
        <input type="number" id="set-nutella" min="0" step="1" required>
      </label>
      <label>Tradicional
        <input type="number" id="set-tradicional" min="0" step="1" required>
      </label>
      <button type="submit">Atualizar estoque</button>
    </form>
  </section>

  <section>
    <h2 id="form-title">Novo pedido</h2>
    <form id="order-form">
      <div class="row">
        <label class="wide">Nome
          <input type="text" id="nome" required>
        </label>
        <label class="wide">Endereço
          <input type="text" id="endereco" required>
        </label>
      </div>
      <div class="row spaced">
        <label>Nutella
          <input type="number" id="qtd-nutella" min="0" step="1" value="0" required>
        </label>
        <label>Tradicional
          <input type="number" id="qtd-tradicional" min="0" step="1" value="0" required>
        </label>
        <label>Taxa de entrega (R$)
          <input type="number" id="taxa" min="0" step="0.01" value="0" required>
        </label>
        <div class="preview">Total do pedido<strong id="preview-total">R$ 0,00</strong></div>
        <button type="submit" id="submit-btn">Lançar pedido</button>
        <button type="button" id="cancel-edit" class="secondary" hidden>Cancelar edição</button>
      </div>
      <p class="error" id="error" role="alert"></p>
    </form>
  </section>

  <section>
    <h2>Pedidos</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Endereço</th>
            <th class="num">Nutella</th>
            <th class="num">Tradicional</th>
            <th class="num">Taxa</th>
            <th class="num">Total</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="orders"></tbody>
        <tfoot>
          <tr>
            <td colspan="5">Totais (exceto cancelados)</td>
            <td class="num" id="total-taxas">R$ 0,00</td>
            <td class="num" id="total-geral">R$ 0,00</td>
            <td colspan="2"></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </section>

  <section id="message-section" hidden>
    <h2>Mensagem do pedido</h2>
    <textarea id="message" rows="12" readonly></textarea>
    <div class="row spaced">
      <button type="button" id="copy-btn">Copiar</button>
      <button type="button" id="close-message" class="secondary">Fechar</button>
      <span id="copy-feedback" role="status"></span>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
